<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Bezel -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="#55AA55" stroke-width="3"/>
  <!-- Bezel ticks every 30 degrees (north replaced by pointer) -->
  <g stroke="#AAAAAA" stroke-width="3" stroke-linecap="round">
    <line x1="70.5" y1="14.5" x2="73"   y2="10.2"/>
    <line x1="85.5" y1="29.5" x2="89.8" y2="27"/>
    <line x1="91"   y1="50"   x2="96"   y2="50"/>
    <line x1="85.5" y1="70.5" x2="89.8" y2="73"/>
    <line x1="70.5" y1="85.5" x2="73"   y2="89.8"/>
    <line x1="50"   y1="91"   x2="50"   y2="96"/>
    <line x1="29.5" y1="85.5" x2="27"   y2="89.8"/>
    <line x1="14.5" y1="70.5" x2="10.2" y2="73"/>
    <line x1="9"    y1="50"   x2="4"    y2="50"/>
    <line x1="14.5" y1="29.5" x2="10.2" y2="27"/>
    <line x1="29.5" y1="14.5" x2="27"   y2="10.2"/>
  </g>
  <!-- North pointer -->
  <path d="M50 4 L56 14 L44 14 Z" fill="#55AA55"/>
  <!-- Shield -->
  <path d="M50 21 L73 29 V49 C73 64 63 74 50 81 C37 74 27 64 27 49 V29 Z"
        fill="#000000" stroke="#55AA55" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- MGRS grid -->
  <g stroke="#005500" stroke-width="2">
    <line x1="38.5" y1="29" x2="38.5" y2="70"/>
    <line x1="61.5" y1="29" x2="61.5" y2="70"/>
    <line x1="31"   y1="38.5" x2="69"   y2="38.5"/>
    <line x1="31"   y1="61.5" x2="69"   y2="61.5"/>
  </g>
  <!-- Reticle -->
  <circle cx="50" cy="50" r="8" fill="none" stroke="#AAAAAA" stroke-width="2.5"/>
  <g stroke="#AAAAAA" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="36" x2="50" y2="43"/>
    <line x1="50" y1="57" x2="50" y2="64"/>
    <line x1="36" y1="50" x2="43" y2="50"/>
    <line x1="57" y1="50" x2="64" y2="50"/>
  </g>
  <circle cx="50" cy="50" r="2.5" fill="#55AA55"/>
</svg>
